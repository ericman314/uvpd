<div class="modal-header">
  <h3 class="modal-title">Delete Results</h3>
</div>
  
<div class="modal-body" style="max-height:50%; overflow-y: auto;">
<label><input type=checkbox ng-model="confirm"> Yes, delete all results from this event</label>
</div>

</div>

<div class="modal-footer">
  <input type=submit name=submit class="btn btn-primary" ng-click="commit()" ng-disabled="!confirm" value='Delete'>
  <input type=button class="btn" ng-click="close()" value="Cancel">
</div>
