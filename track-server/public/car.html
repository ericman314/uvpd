<p><a href="#" ng-click="editCar()">Edit car</a></p>
<p><a href="#" ng-click="deleteCar()">Delete car</a></p>
<br>
<br>
<img ng-src="{{imageUrl}}">

<p>Achievements: {{car.achievements.split(',').join(', ')}}</p>

<div class="results-pane">

  <ul>

    <li class="x-angular-animate list-item" ng-repeat="result in results | orderBy : result.resultDate track by $index " style="border-top:solid gray 1px;">
      <!-- <div class="col-sm-2"><a href="#" ng-click="deleteResult(result)">Delete result</a></div>
  <div class="col-sm-2">Lane {{result.lane}}</div>
  <div class="col-sm-2">{{result.time.toFixed(4)}}</div>
  <div class="col-sm-2">{{result.Date}}</div> -->


      <div uib-dropdown>
        <a href class=name uib-dropdown-toggle id="simple-dropdown-{{result.resultId}}">

          <div class="name result-name">{{result.resultDate | date : "h:mm:ss a"}} {{car.carName}}</div>
          <div class="result-time lane-color-{{result.lane}}" style="top:-6px;">{{ formatTime(result.time) }}</div>
          <div style="clear:both;"></div>
        </a>
        <ul class="dropdown-menu" uib-dropdown-menu id="simple-dropdown-{{result.resultId}}">
          <li><a href ng-click="deleteResult(result)">Delete result</a></li>
        </ul>
      </div>
    </li>
  </ul>
</div>

</div>
