<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <meta name="description" content="Pinewood Derby Track Rental in Utah County. Serving Provo, Orem, Lehi, Spanish Fork, Pleasant Grove, Springville, American Fork, and Eagle Mountain areas.">

	<title>Utah Valley Pinewood Derby - Vote for your Favorite Car</title>
	<!--<link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>-->
	<link rel="stylesheet" href="main.css?v=2">
	<link rel="icon" type="image/png" href="favicon.ico">
	
</head>
<!--#include virtual="/reservation-modal.shtml"-->

<body id="top">
<!--#include virtual="/nav.shtml"-->
  
	
		<div class="pageContent-fullWidth center">
      
      <h1>Vote for your Favorite Car</h1>
       
        <p id="loading">Loading, please wait...</p>
        
        <p id="noResults" style="display:none;">Oops, there are no events right now.</p>

        <p id="alreadyVoted" style="display:none;">You've already voted. Please try again in a few minutes.</p>
        
			  <div id="results" style="display:none;"></div>
     
		</div>
    
    <script src='https://code.jquery.com/jquery-3.2.1.min.js'></script>
    <script>
    
      var mostRecentEvent, cars;
    
      function getEvents() {
        $.get("/api/v2/recentEvents", function(data) {
          
          mostRecentEvent = null;

          for(var i=0; i<data.length; i++) {
            if(new Date() - new Date(data[i].Date) < 86400000 && data[i].OnlineVoting) {
              // This event takes place today
              if(!mostRecentEvent || data[i].Date < mostRecentEvent.Date) {
                mostRecentEvent = data[i];
              }
            }
          }
          
          if(mostRecentEvent && cars) {
            updateEventAndCars();
          }
        });
      }
      
      function getCars() {
        $.get("/api/v2/recentCars", function(data) {
          cars = data;
          if(mostRecentEvent && cars) {
            updateEventAndCars();
          }
        });
      }
            
      function updateEventAndCars() {
      
        // Move the cars into the events
        
        mostRecentEvent.cars = [];
        
        for(var i=0; i<cars.length; i++) {
          if(mostRecentEvent.Id == cars[i].EventId) {
            mostRecentEvent.cars.push(cars[i]);
          }
        }
        
        $results = $('#results');
        
        $results.empty();
        
          var $event = $('<div id="' + mostRecentEvent.Id + '"></div>');
          
          $event.append('<hr>');
          $event.append('<h2>' + mostRecentEvent.Name + '</h2>');
          $event.append('<p>Tap to select up to three (3) cars, then submit your vote below.</p><br>');

          var $imgContainer = $('<div class="imgContainer">');
          $event.append($imgContainer);
          if(mostRecentEvent.cars) {
            for(var i=0; i<mostRecentEvent.cars.length; i++) {
              var $imgWrapper = $('<div class="imgWrapper" style="margin-bottom:50px" data-id="' + mostRecentEvent.cars[i].Id + '" >');
              $imgWrapper.append('<img src="/api/v2/cars/' + mostRecentEvent.cars[i].Id + '.jpg">');

              $imgWrapper.click(function(e) {
                $(this).toggleClass('selected');
                var nSelected = $('.imgWrapper.selected').length;
                var confirmationText = "Select up to 3 cars above to submit a vote.";
                $('#submit-vote').addClass('disabled');
                if(nSelected > 3) {
                  confirmationText = "You may only vote for 3 cars.";
                }
                else if(nSelected > 0) {
                  $('#submit-vote').removeClass('disabled');
                  confirmationText = "Vote for " + nSelected + " car" + (nSelected===1?'':'s');
                }
                $('#vote-confirmation-text').text(confirmationText);
              });

              $imgContainer.append($imgWrapper);
            }
          }
        
          $event.append('<p><span id="vote-confirmation-text">Tap on the cars above to select your vote(s).</span></p>');
          $event.append('<a href="#" class="button disabled" onclick="submitVote()" id="submit-vote">Submit Vote</a>');
          $event.append('<p><a href="#top">Back to top</a></p>');
        
          $results.append($event);
        
        
        
        $results.show();
        $('#loading').hide();
        
        if(!mostRecentEvent)
          $('#noResults').show();
       
      }
      

      function submitVote() {
        var nSelected = $('.imgWrapper.selected').length;
        if(nSelected > 0 && nSelected <= 3) {
          var votes = $('.imgWrapper.selected').get().map(function(e) {
            return $(e).attr('data-id');
          }).join(',');
          
          $.post('/api/v2/vote', { votes: votes }, function(data) {
            console.log(data);
            localStorage.setItem('voteRecorded', Date.now())
            location.href = 'vote-recorded';
          });

          $('#submit-vote').addClass('disabled');
        }
      }
      
      $(function() {
        var voteRecorded = localStorage.getItem('voteRecorded') || 0;
        if(Date.now() - voteRecorded > 300000) {
          getEvents();
          getCars();
        }
        else {
          $('#loading').hide();
          $('#alreadyVoted').show();
        }
      });
     
    </script>
    <!--#include virtual="/footer.shtml"-->
</body>
</html>
