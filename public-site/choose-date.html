<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.1/moment.min.js"></script>
<script>
  var dateData = [];

  function renderDatepicker() {
    $('#loading-calendar').remove();

    var dp = $("#datepicker").datepicker({
      dateFormat: 'yy-mm-dd',
      changeMonth: true,
      changeYear: true,
      beforeShowDay: function (date) {
        var m = moment(date);
        var mdate = m.format("YYYY-MM-DD");

        var available = true;


        if (m.isBefore(moment().add(6, "days"))) {
          available = false;
        }
        else if (m.day() === 0) {
          available = false;
        }
        else if (dateData.indexOf(mdate) >= 0) {
          available = false;
        }

        // Block out everything prior to this date
        if (m.isBefore(moment('2019-05-01'))) {
          available = false;
        }

        return [
          available,
          available ? "" : "unavailable",
          available ? "Available" : "Not available"
        ]
      }
    });

    $("#datepicker").on('change', function (evt) {
      var date = $('#datepicker').datepicker("getDate");
      var m = moment(date);
      var mdate = m.format("YYYY-MM-DD");

      if (/[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(mdate)) {
        $('.modalInnerWrapper iframe').remove();

        var src = "https://docs.google.com/forms/d/e/1FAIpQLSeltFzaGPqtZyB8LaaBQ-hS-HcjGLTheiwkrX9eXTXhkMVKbA/viewform?entry.1063901444=" + mdate;
        // $('.modalInnerWrapper').append('<iframe class=modal frameborder=0 src=' + src + '>Loading...</iframe>');
        $('#formLink').attr('href', src)
      }

    });

    // $('#datepicker').datepicker('setDate', '2019-05-01');
  }

  $(function () {
    var cal_id = 'hl5e0uijgvmqo84sd4nht2imc0@group.calendar.google.com';
    var api_key = 'AIzaSyDFIEq_I3GZ8myruxbND4zKnK5mfs8wwVs';
    var query = {
      key: api_key,
      singleEvents: true,
      orderBy: "startTime",
      timeMin: (new Date()).toISOString()
    }
    var url = "https://www.googleapis.com/calendar/v3/calendars/" + cal_id + "/events?" + $.param(query);

    $.ajax({
      url: url,
      success: function (data) {
        dateData = data.items.map(i => i.start.date || i.start.dateTime.substring(0, 10));
        renderDatepicker();
      }
    });

    setTimeout(function () {
      $('#loading-calendar').html('Loading calendar...<br><br>This is taking a while. You can still click "Continue" below to make a reservation.');
    }, 3000);

    // Load upcoming events
    $.ajax({
      url: 'https://script.google.com/macros/s/AKfycbzWY3EZ3yRfLzIDSyzsAZjJZb4dpshRj2y6xyG4_olVqf8sUDkE/exec',
      success: function (data) {
        var $tab = $('table#upcoming');
        for (var i = 0; i < data.length; i++) {
          $tab.append($('<tr><td>' + moment(data[i].date).format("MMM D") + '</td><td>' + data[i].city + '</td></tr>'));
        }
      }
    });

  });


</script>
