<html>
  <body>
    <canvas id=canvas width=1900 height=600>
  </body>
  <script>
  
    var nPts = 50;
    
    var x = [];
    var y = [];
    var fx = [];
    var fy = [];
    
    var x0 = 0;
    var y0 = 0;
    var xn = 32;
    var yn = 0;
    var dStat = (xn / nPts) * 1;
    
    for(var i=0; i<nPts; i++) {
      var t = i/(nPts-1);
      x[i] = x0 * (1-t) + xn * t;
      y[i] = y0 * (1-t) + yn * t;
      fx[i] = 0;
      fy[i] = 0;
    }
    
    var adj = [];
    for(var i=0; i<nPts-1; i++) {
      adj[i] = 0;
    }
    
    function relax(debug) {
     // dStat = dStat * 0.99999;
     
      var mind = 9999;
      var maxd = 0;
     
      for(var i=0; i<nPts; i++) {
        
        fx[i] *= 0.8;
        fy[i] *= 0.8;
        
        // Length to neighbor
        if(i > 0) {
          var d = Math.sqrt((x[i] - x[i-1]) * (x[i] - x[i-1]) + (y[i] - y[i-1]) * (y[i] - y[i-1]));
          mind = Math.min(d, mind);
          maxd = Math.max(d, maxd);
          adj[i-1] -= (d-dStat)*0.005;
          
          var str = Math.pow(d-dStat-adj[i-1],5) * 100;
          if(str > 0.01) str = 0.01;
          fx[i] += (x[i-1] - x[i]) * str;
          fy[i] += (y[i-1] - y[i]) * str;
          fx[i-1] -= (x[i-1] - x[i]) * str;
          fy[i-1] -= (y[i-1] - y[i]) * str;
        }
        /*
        if(i < nPts-1) {
          var d = Math.sqrt((x[i] - x[i+1]) * (x[i] - x[i+1]) + (y[i] - y[i+1]) * (y[i] - y[i+1]));
          
          console.log(d);
          adj[i] -= (d-dStat)*0.01;
          
          var str = Math.pow(d-dStat-adj[i],5) * 100;
          if(str > 0.01) str = 0.01;
          fx[i] += (x[i+1] - x[i]) * str;
          fy[i] += (y[i+1] - y[i]) * str;
          //fx[i+1] -= (x[i+1] - x[i]) * str;
          //fy[i+1] -= (y[i+1] - y[i]) * str;
        }
        */
        
        // Stiffness
        
        str = 0.000075;
        if(i>0 && i<nPts-1) {
          fx[i] += str*(x[i+1] + x[i-1] - 2*x[i]);
          fy[i] += str*(y[i+1] + y[i-1] - 2*y[i]);
          fx[i-1] -= 0.5 * str*(x[i+1] + x[i-1] - 2*x[i]);
          fy[i-1] -= 0.5 * str*(y[i+1] + y[i-1] - 2*y[i]);
          fx[i+1] -= 0.5 * str*(x[i+1] + x[i-1] - 2*x[i]);
          fy[i+1] -= 0.5 * str*(y[i+1] + y[i-1] - 2*y[i]);
          
        }
        
        fy[i] += 0.0000000009;
      }
      
      for(var i=0; i<nPts; i++) {
      
        
        x[i] += 10 * fx[i];
        y[i] += 10 * fy[i];

        if(y[i] < 0) {
         // y[i] = 0;
        }
      }
      
      if(debug)
        console.log(mind, maxd);
      
      //x[0] = x0;
     // y[1] = y0;
      
      if(x[0] > 15) x[0] = 15;
     
      y[0] = y0;
      x[nPts-1] = xn;
      y[nPts-1] = yn;
    
    }
    
    
    function drawPts() {
      //console.log(dStat);
      var ctx = document.getElementById('canvas').getContext('2d');
      
      ctx.clearRect(0, 0, 1900, 600);
      ctx.strokeStyle = "red";
      ctx.beginPath();
      ctx.moveTo(5+x[0]*59, 290-y[0]*59);
      for(var i=0; i<nPts; i++) {
        ctx.lineTo(5+x[i]*59, 290-y[i]*59);
        ctx.fillRect(5+x[i]*59-1, 290-y[i]*59-1,3,3);
        //console.log(adj[i]);
      }
      ctx.stroke();
    }
    
    function animate() {
 //   y0 = y0 + 1;
   // if(y0 > 4) y0 = 4;
      for(var i=0; i<10000; i++) {
        relax();
      }
      relax();
      drawPts();
      window.requestAnimationFrame(animate);
    }
    
    
    animate();
      
  
  </script>
</html>
