          activateScreen('instrumentScreen');
        }
        e.preventDefault();

        e.preventDefault();
      });

      var questions = [];
      var answered = [];
      var totalStartTime;
      
      function startQuiz() {
        questions = [];
        answered = [];
        var allNotes = [];
        
        // Flatten allNotes
        for(var i=0; i<instruments[model.instrument].levels[model.level].notes.length; i++) {
          allNotes = allNotes.concat(instruments[model.instrument].levels[model.level].notes[i]);
        }
        
        // Remove dupes        
        allNotes = allNotes.filter(function(item, pos, self) {
          return item && self.indexOf(item) == pos;
        })
       
        for(var i=0; i<allNotes.length; i++) {
          var noteParts = allNotes[i].split('/');
          for(var j=0; j<noteParts.length; j++) {   // Or choose a random note?
            var note = noteParts[j];
           
            // Choose a random key signature for each question using reservoir sampling.
            var noteNoNumber = note.replace(/([A-G][b|#]?)([0-9])/, "$1");
            var keyIdx = -1;
            var nItems = 0;
            for(var k=0; k<keySignatures.length; k++) {
              if(keySignatures[k].indexOf(noteNoNumber) >= 0) {
                nItems++;
                if(Math.random() < 1.0/nItems) {
                  keyIdx = k;
                }
              }
            }
            var key = keySignatures[keyIdx][0];
            
            questions.push({
              note: note,
              type: 'fingering',
              attempts: 1,
              elapsed: 0,
              key: key,
              incorrectResponses: []
            });
            
            // Choose a random key signature for each question using reservoir sampling.
            var noteNoNumber = note.replace(/([A-G][b|#]?)([0-9])/, "$1");
            var keyIdx = -1;
            var nItems = 0;
            for(var k=0; k<keySignatures.length; k++) {
              if(keySignatures[k].indexOf(noteNoNumber) >= 0) {
                nItems++;
                if(Math.random() < 1.0/nItems) {
                  keyIdx = k;
                }
              }
            }
            var key = keySignatures[keyIdx][0];
            
            questions.push({
              note: note,
              type: 'note',
              attempts: 1,
              elapsed: 0,
              key: key,
              incorrectResponses: []
            });
            
          }
        }
        
     
        
        // Assign values to fingering buttons
        for(var r=0; r<8; r++) {
          for(var c=0; c<4; c++) {
            var note = instruments[model.instrument].levels[model.level].notes[c][r];
            if(note) {
              $('input.finger[data-row=' + r + '][data-col=' + c + ']').each(function() {
                $(this).attr('data-val', note);
                
                $(this).val(note.replace(/([A-G][b|#]?)([0-9])/, "$1"));
                
                $(this).show();
              });
            }
          }
        }
        
        shuffle(questions);
        totalStartTime = Date.now();
        nextQuestion();
      }
        
      function shuffle(array) {
        var currentIndex = array.length, temporaryValue, randomIndex;

        // While there remain elements to shuffle...
        while (0 !== currentIndex) {

          // Pick a remaining element...
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex -= 1;

          // And swap it with the current element.
          temporaryValue = array[currentIndex];
          array[currentIndex] = array[randomIndex];
          array[randomIndex] = temporaryValue;
        }

        return array;
      }
        
      var currentNote = '';
      var startTime = 0;
      
      var currentType = '';
        
      function nextQuestion() {
        if(questions.length === 0) {
          quizComplete();
          return;
        }
        
        // What note is it?
        var note = questions[0].note;
        currentNote = note;
        
        // What question type is it?
        currentType = questions[0].type;   
        
        
        var key = questions[0].key;
        
        if(currentType === 'note') {
          // Remove the number from this note.
          currentNote = currentNote.replace(/([A-G][b|#]?)([0-9])/, "$1");
        }
        
        
        var clef = instruments[model.instrument].clef;
        console.log(note);
        var noteNoAccidental = note.replace(/([A-G])[b|#]?([0-9])/, "$1/$2");
        
        var text = 'tabstave notation=true tablature=false key=' + key + ' clef=' + clef.toLowerCase() + '\n notes ' + noteNoAccidental;
        
        //var VexTab = vextab.VexTab;
        //var Artist = vextab.Artist;
        var Renderer = Vex.Flow.Renderer;
        
        var renderer = new Renderer($('canvas')[0], Renderer.Backends.CANVAS);
        var artist = new Artist(5, -20, 150, {scale: 1.5});
        var v = new VexTab(artist);
        
        console.log(currentNote);
        
        v.parse(text);
        artist.render(renderer);
        
        if(currentType === 'note') {
          $('#playScreenNotes').show();
          $('#playScreenFingers').hide();
        }
        else if (currentType === 'fingering') {
          $('#playScreenNotes').hide();
          $('#playScreenFingers').show();
        }
        
        $('.spanQNum').text(answered.length);
        $('.spanQDen').text(questions.length + answered.length);
        
        if(currentType === "note")
          $('.spanPrompt').text("What note is this?");
        else if (currentType === "fingering")
          $('.spanPrompt').text("What fingering is this?");
        
        $('input.note, input.finger').prop('disabled', false);
        startTime = Date.now();
      }
      
      $('input.note, input.finger').click(function(e) {
        $('input.note, input.finger').prop('disabled', true);
        if($(this).attr('data-val') === currentNote) {
          console.log("Correct");
          var ans = questions.splice(0, 1)[0];
          ans.elapsed += (Date.now() - startTime) / 1000;
          // This question is all done
          answered.push(ans);
          var self = this;
          
          $(self).addClass('correct');
          setTimeout(function() {
            $(self).removeClass('correct');
            nextQuestion();
          }, 1500);
          
          $('.spanPrompt').text("Correct!");
        }
        else {
          console.log("Incorrect");
          var ans = questions.splice(0, 1)[0];
          ans.elapsed += (Date.now() - startTime) / 1000;
          ans.attempts++;
          ans.incorrectResponses.push($(this).attr('data-val'));
          // Requeue this question
          questions.push(ans);
          var self = this;
          $(self).addClass('incorrect');
          setTimeout(function() {
            $(self).removeClass('incorrect');
            nextQuestion();
          }, 4000);
          
          // What was the correct answer?
          var correctInput = $("input[data-val='" + currentNote + "']");
          
          setTimeout(function() {
            $(correctInput).addClass('correct');  
          }, 500);
          setTimeout(function() {
            $(correctInput).removeClass('correct');  
          }, 4000);
          $('.spanPrompt').text("Incorrect");
        }
        
      });
      
      function quizComplete() {
        model.totalElapsedTime = (Date.now() - totalStartTime) / 1000;
        model.answered = answered;
        
        send("Results", [
          model.name,
          model.instrument,
          model.level,
          model.totalElapsedTime,
          JSON.stringify(model.answered)
        ]);
        
        var mins = Math.floor(model.totalElapsedTime / 60);
        var secs = Math.ceil(model.totalElapsedTime - mins * 60);
        
        var minsStr = (mins < 10 ? '0' : '') + mins;
        var secsStr = (secs < 10 ? '0' : '') + secs;
        
        $('.spanTime').text(minsStr + ":" + secsStr);
        
        activateScreen('finishScreen');
      }
      
      activateScreen('welcomeScreen');
      
      /*
      model.name = "Eric";
      model.instrument = "Cello";
      model.level = '4';
      activateScreen('playScreen');
      startQuiz(model);
      */
      
      $('#name').focus();
    
      
     });
      
    </script>
  </body>
